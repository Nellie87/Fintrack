# Local full stack: Postgres + API + web app.
#
#   docker compose up --build
#
# Web: http://localhost:8080   API: http://localhost:4000 (Swagger at /api/docs)
# Demo login: demo@fintrack.app / Demo@2026

x-db-url: &db-url postgresql://fintrack:fintrack@db:5432/fintrack

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack
      POSTGRES_DB: fintrack
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-off: apply migrations and load the demo data (safe to re-run).
  migrate:
    build:
      context: ./backend
      target: builder
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: *db-url
      DIRECT_URL: *db-url
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    ports:
      - "4000:3000" # 4000 on the host so it never clashes with `npm run dev`
    environment:
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
